name: calc_vault
description: 'CalcVault: Secret Calculator & Photo Locker. An offline encrypted vault.'
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  crypto: ^3.0.6
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4
  camera: ^0.11.2
  permission_handler: ^12.0.1
  sensors_plus: ^6.1.2
  video_player: ^2.10.1
  audioplayers: ^6.8.1
  record: ^6.1.2
  image_picker: ^1.2.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/decoy/
    - assets/branding/calculator_icon.png
  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
